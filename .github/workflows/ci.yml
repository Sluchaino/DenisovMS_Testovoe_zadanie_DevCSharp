name: Build and test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore VulnerabilityTracker.slnx
      - run: dotnet build VulnerabilityTracker.slnx --no-restore --configuration Release
      - run: dotnet test VulnerabilityTracker.slnx --no-build --configuration Release
